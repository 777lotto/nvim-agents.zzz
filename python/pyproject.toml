[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "agent-manager-claude-worker"
version = "0.1.0"
description = "Private Claude Agent SDK worker for agent-manager"
readme = "README.md"
requires-python = ">=3.13,<3.14"
license = "MIT"
authors = [{ name = "zemrip-ai" }]
dependencies = [
    "claude-agent-sdk==0.2.152",
    "openai-codex==0.155.1",
]

[project.scripts]
agent-manager-claude-worker = "agent_manager_claude_worker.__main__:main"

[dependency-groups]
dev = [
  "hatchling==1.32.0",
  "jsonschema>=4.25,<5",
  "pyright>=1.1.405,<2",
  "ruff>=0.12,<1",
]

[tool.hatch.build.targets.wheel]
packages = ["src/agent_manager_claude_worker", "src/agent_manager_workflows"]

[tool.ruff]
target-version = "py313"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["A", "ASYNC", "B", "C4", "E", "F", "I", "PERF", "PIE", "PL", "RUF", "SIM", "UP"]
ignore = ["PLR2004"]

[tool.ruff.lint.per-file-ignores]
"src/agent_manager_claude_worker/sdk_adapter.py" = ["PLC2701", "RUF029"]
"tests/test_sdk_adapter.py" = ["RUF029"]
"tests/test_worker.py" = ["RUF029"]

[tool.pyright]
pythonVersion = "3.13"
typeCheckingMode = "strict"
include = ["src", "tests"]
extraPaths = ["../scripts"]
reportMissingTypeStubs = false
