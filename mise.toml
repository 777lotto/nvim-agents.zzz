[tools]
actionlint = "1.7.12"
python = "3.13.15"
rust = { version = "1.98.0", profile = "minimal", components = "clippy,rustfmt" }
shellcheck = "0.11.0"
uv = "0.12.7"
neovim = "0.12.4"

# uv discovers interpreters through PATH, and an already-activated shell can
# leave /usr/bin ahead of this project's Mise tools, so a system CPython of the
# same minor series would silently seed python/.venv and fail the release
# build's exact-version check. Pin the request to the Mise-managed version and
# refuse downloads so a missing install surfaces as `mise install`.
[env]
UV_PYTHON = "3.13.15"
UV_PYTHON_DOWNLOADS = "never"

[tasks.setup]
description = "Install the locked Python worker environment"
dir = "python"
run = "uv sync --frozen --all-groups"

[tasks.fmt]
description = "Check Rust and Python formatting"
depends = ["setup"]
run = [
  "cargo fmt --all -- --check",
  "cd python && uv run ruff format --check .",
]

[tasks.lint]
description = "Run Rust and Python static checks"
depends = ["setup"]
run = [
  "actionlint",
  "cargo clippy --workspace --all-targets --all-features -- -D warnings",
  "cd python && uv run ruff check .",
  "cd python && uv run pyright src tests",
]

[tasks.test]
description = "Run Rust, Python, Lua, and cross-language contract tests"
depends = ["setup"]
run = [
  "scripts/test-rust.sh",
  "scripts/test-python.sh",
  "scripts/test-lua.sh",
]

[tasks.verify]
description = "Run the complete M5 handoff gate"
run = "scripts/verify.sh"

[tasks.release]
description = "Build the reproducible Linux x86_64 release bundle"
depends = ["setup"]
run = "scripts/build-release.sh"

[tasks."release-test"]
description = "Prove release reproducibility and resumable installation"
depends = ["setup"]
run = "scripts/verify-release.sh"

[tasks."ux-test"]
description = "Run pinned Foundation, Styling, and Chrome integration tests"
run = "scripts/test-ux.sh"

[tasks."codex-schema"]
description = "Regenerate the pinned Codex App Server schema bundle"
run = "scripts/update-codex-schema.sh"
