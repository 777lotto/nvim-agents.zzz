[workspace]
members = ["crates/agent-manager-broker"]
resolver = "2"

[workspace.package]
version = "0.2.1"
edition = "2024"
rust-version = "1.98"
license = "MIT"
repository = "https://github.com/777lotto/nvim-agents.zzz"

[workspace.dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
tokio = { version = "1.47", features = ["io-std", "io-util", "macros", "net", "process", "rt-multi-thread", "signal", "sync", "time"] }
time = { version = "0.3", features = ["formatting"] }
uuid = { version = "1.18", features = ["serde", "v4"] }

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
